<div class="overflow-hidden">
  
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-spinner p-8">
    <mat-progress-spinner diameter="40" color="primary"></mat-progress-spinner>
    <span class="ml-3 text-secondary-600">Loading jobs...</span>
  </div>

  <!-- Table Content -->
  <div *ngIf="!loading">
    
    <!-- Material Table -->
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" matSort class="w-full">
        
        <!-- Job ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-6 py-4 text-left font-semibold text-secondary-700 bg-secondary-50">
            Job ID
          </th>
          <td mat-cell *matCellDef="let job" class="px-6 py-4 text-sm text-secondary-900 font-mono">
            {{ job.id }}
          </td>
        </ng-container>

        <!-- SKU Column -->
        <ng-container matColumnDef="sku">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-6 py-4 text-left font-semibold text-secondary-700 bg-secondary-50">
            SKU
          </th>
          <td mat-cell *matCellDef="let job" class="px-6 py-4 text-sm text-secondary-900 font-mono">
            {{ job.sku }}
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-6 py-4 text-left font-semibold text-secondary-700 bg-secondary-50">
            Status
          </th>
          <td mat-cell *matCellDef="let job" class="px-6 py-4">
            <span class="status-badge" [ngClass]="getStatusClass(job.status)">
              {{ job.status }}
            </span>
          </td>
        </ng-container>

        <!-- Assigned User Column -->
        <ng-container matColumnDef="assignedUser">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-6 py-4 text-left font-semibold text-secondary-700 bg-secondary-50">
            Assigned User
          </th>
          <td mat-cell *matCellDef="let job" class="px-6 py-4 text-sm text-secondary-900">
            <div class="flex items-center">
              <mat-icon class="text-secondary-400 text-sm">person</mat-icon>
              {{ job.assignedUser }}
            </div>
          </td>
        </ng-container>

        <!-- Created Date Column -->
        <ng-container matColumnDef="createdDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-6 py-4 text-left font-semibold text-secondary-700 bg-secondary-50">
            Created Date
          </th>
          <td mat-cell *matCellDef="let job" class="px-6 py-4 text-sm text-secondary-900">
            <div class="flex items-center">
              <mat-icon class="text-secondary-400 mr-2 text-sm">schedule</mat-icon>
              {{ formatDate(job.createdDate) }}
            </div>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="px-6 py-4 text-left font-semibold text-secondary-700 bg-secondary-50">
            Actions
          </th>
          <td mat-cell *matCellDef="let job" class="px-6 py-4">
            <button 
              mat-icon-button 
              color="primary" 
              (click)="onRowClick(job)"
              class="hover:bg-primary-50 transition-colors duration-200"
              matTooltip="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr 
          mat-row 
          *matRowDef="let row; columns: displayedColumns;" 
          (click)="onRowClick(row)"
          class="hover:bg-secondary-50 cursor-pointer transition-colors duration-200 border-b border-secondary-100">
        </tr>
      </table>
    </div>

    <!-- Pagination -->
    <mat-paginator
      [length]="dataSource.data.length"
      [pageSizeOptions]="[5, 10, 25, 50]" 
      [pageSize]="5"
      showFirstLastButtons 
      class="border-t border-secondary-200 bg-secondary-50/30">
    </mat-paginator>

  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && jobs.length === 0" class="text-center py-16">
    <div class="bg-secondary-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
      <mat-icon class="text-secondary-400 text-3xl">inbox</mat-icon>
    </div>
    <h3 class="text-lg font-semibold text-secondary-800 mb-2">No jobs found</h3>
    <p class="text-secondary-600">Try adjusting your filters or check back later.</p>
  </div>

</div>
