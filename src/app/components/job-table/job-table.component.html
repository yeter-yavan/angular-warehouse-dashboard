<div class="overflow-hidden">
  
  <!-- Loading State -->
  <div *ngIf="loading" class="loading-spinner p-8">
    <mat-spinner diameter="40"></mat-spinner>
    <span class="ml-3 text-gray-600">Loading jobs...</span>
  </div>

  <!-- Table Content -->
  <div *ngIf="!loading">
    
    <!-- Table Header -->
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-semibold text-gray-800">Warehouse Jobs</h3>
      <p class="text-sm text-gray-600 mt-1">{{ jobs.length }} jobs found</p>
    </div>

    <!-- Material Table -->
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="dataSource" matSort class="w-full">
        
        <!-- Job ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-3 text-left font-medium text-gray-700">
            Job ID
          </th>
          <td mat-cell *matCellDef="let job" class="px-4 py-3 text-sm text-gray-900 font-mono">
            {{ job.id }}
          </td>
        </ng-container>

        <!-- SKU Column -->
        <ng-container matColumnDef="sku">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-3 text-left font-medium text-gray-700">
            SKU
          </th>
          <td mat-cell *matCellDef="let job" class="px-4 py-3 text-sm text-gray-900 font-mono">
            {{ job.sku }}
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-3 text-left font-medium text-gray-700">
            Status
          </th>
          <td mat-cell *matCellDef="let job" class="px-4 py-3">
            <span class="px-2 py-1 text-xs font-medium rounded-full" [ngClass]="getStatusColor(job.status)">
              {{ job.status }}
            </span>
          </td>
        </ng-container>

        <!-- Assigned User Column -->
        <ng-container matColumnDef="assignedUser">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-3 text-left font-medium text-gray-700">
            Assigned User
          </th>
          <td mat-cell *matCellDef="let job" class="px-4 py-3 text-sm text-gray-900">
            {{ job.assignedUser }}
          </td>
        </ng-container>

        <!-- Created Date Column -->
        <ng-container matColumnDef="createdDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-3 text-left font-medium text-gray-700">
            Created Date
          </th>
          <td mat-cell *matCellDef="let job" class="px-4 py-3 text-sm text-gray-900">
            {{ formatDate(job.createdDate) }}
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="px-4 py-3 text-left font-medium text-gray-700">
            Actions
          </th>
          <td mat-cell *matCellDef="let job" class="px-4 py-3">
            <button 
              mat-icon-button 
              color="primary" 
              (click)="onRowClick(job)"
              class="hover:bg-blue-50"
              matTooltip="View Details">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
        <tr 
          mat-row 
          *matRowDef="let row; columns: displayedColumns;" 
          (click)="onRowClick(row)"
          class="hover:bg-gray-50 cursor-pointer transition-colors duration-150">
        </tr>
      </table>
    </div>

    <!-- Pagination -->
    <mat-paginator 
      [pageSizeOptions]="[5, 10, 25, 50]" 
      showFirstLastButtons 
      class="border-t border-gray-200">
    </mat-paginator>

  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && jobs.length === 0" class="text-center py-12">
    <mat-icon class="text-gray-400 text-6xl mb-4">inbox</mat-icon>
    <h3 class="text-lg font-medium text-gray-900 mb-2">No jobs found</h3>
    <p class="text-gray-600">Try adjusting your filters or check back later.</p>
  </div>

</div>
