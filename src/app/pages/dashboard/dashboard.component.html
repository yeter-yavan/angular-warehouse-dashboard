<div class="h-screen bg-gray-50">
  
  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <mat-icon class="text-blue-600 text-2xl">warehouse</mat-icon>
          <h1 class="text-2xl font-bold text-gray-900">Warehouse Dashboard</h1>
        </div>
        
        <div class="flex items-center space-x-3">
          <!-- View Toggle -->
          <div class="flex items-center bg-gray-100 rounded-lg p-1">
            <button 
              mat-stroked-button 
              [class.bg-white]="viewMode === 'table'"
              [class.shadow-sm]="viewMode === 'table'"
              (click)="viewMode = 'table'"
              class="rounded-md transition-all duration-200"
              [disabled]="loading">
              <mat-icon class="mr-2">table_chart</mat-icon>
              Table
            </button>
            <button 
              mat-stroked-button 
              [class.bg-white]="viewMode === 'cards'"
              [class.shadow-sm]="viewMode === 'cards'"
              (click)="viewMode = 'cards'"
              class="rounded-md transition-all duration-200"
              [disabled]="loading">
              <mat-icon class="mr-2">grid_view</mat-icon>
              Cards
            </button>
          </div>

          <button 
            mat-stroked-button 
            (click)="refreshJobs()"
            [disabled]="loading"
            class="hover:bg-gray-50">
            <mat-icon class="mr-2">refresh</mat-icon>
            Refresh
          </button>
          
          <div class="flex items-center space-x-2 text-sm text-gray-600">
            <mat-icon class="text-green-500">circle</mat-icon>
            <span>{{ jobs.length }} Jobs</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content with Drawer -->
  <mat-drawer-container class="h-full">
    
    <!-- Main Content Area -->
    <mat-drawer-content class="p-6">
      
      <!-- Filter Section -->
      <app-job-filter 
        (filterChange)="onFilterChange($event)">
      </app-job-filter>

      <!-- Table View -->
      <div *ngIf="viewMode === 'table'">
        <app-job-table 
          [jobs]="jobs"
          [loading]="loading"
          (jobSelected)="onJobSelected($event)">
        </app-job-table>
      </div>

      <!-- Card View -->
      <div *ngIf="viewMode === 'cards'">
        <app-job-cards 
          [jobs]="jobs"
          [loading]="loading"
          (jobSelected)="onJobSelected($event)">
        </app-job-cards>
      </div>

    </mat-drawer-content>

    <!-- Sidebar Drawer -->
    <mat-drawer 
      #drawer 
      mode="side" 
      position="end" 
      [opened]="sidebarOpen"
      class="w-96 border-l border-gray-200">
      
      <app-job-detail-sidebar
        [job]="selectedJob"
        [loading]="loading"
        (close)="onSidebarClose()"
        (statusUpdate)="onStatusUpdate($event)">
      </app-job-detail-sidebar>
      
    </mat-drawer>

  </mat-drawer-container>

</div>
