<div class="h-screen bg-gray-50">
  
  <!-- Header -->
  <mat-toolbar class="bg-white shadow-sm border-b border-gray-200">
    <div class="flex items-center justify-between w-full px-6">
      <div class="flex items-center space-x-4">
        <mat-icon class="text-blue-600 text-2xl">warehouse</mat-icon>
        <h1 class="text-2xl font-bold text-gray-900">Warehouse Dashboard</h1>
      </div>
    </div>
  </mat-toolbar>

  <!-- Main Content with Sidenav -->
  <mat-sidenav-container class="h-full">
    
    <!-- Main Content Area -->
    <mat-sidenav-content class="p-6">
      
      <!-- Filter Section -->
      <mat-card class="mb-4">
        <mat-card-header>
          <mat-card-title class="text-lg font-semibold text-gray-800">
            <mat-icon>filter_list</mat-icon>
            Filter Jobs
          </mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <app-job-filter 
            (filterChange)="onFilterChange($event)">
          </app-job-filter>
        </mat-card-content>
      </mat-card>

      <!-- Job List Controls - Above the job list -->
      <div class="job-list-controls p-4 mb-4">
        <div class="flex items-center justify-between">
          <!-- Left side - View toggle and job count -->
          <div class="flex items-center space-x-4">
            <!-- View Toggle -->
            <mat-button-toggle-group 
              [value]="viewMode" 
              (change)="viewMode = $event.value"
              [disabled]="loading"
              class="bg-gray-100">
              <mat-button-toggle value="table">
                <mat-icon class="mr-2">table_chart</mat-icon>
                Table
              </mat-button-toggle>
              <mat-button-toggle value="cards">
                <mat-icon class="mr-2">grid_view</mat-icon>
                Cards
              </mat-button-toggle>
            </mat-button-toggle-group>          
          </div>

          <!-- Right side - Refresh button -->
          <button 
            mat-stroked-button 
            (click)="refreshJobs()"
            [disabled]="loading"
            class="hover:bg-gray-50">
            <mat-icon class="mr-2">refresh</mat-icon>
            Refresh
          </button>
        </div>
      </div>

      <!-- Content Section -->
      <mat-card>
        <mat-card-content class="p-0">
          <!-- Table View -->
          <div *ngIf="viewMode === 'table'">
            <app-job-table 
              [jobs]="jobs"
              [loading]="loading"
              (jobSelected)="onJobSelected($event)">
            </app-job-table>
          </div>

          <!-- Card View -->
          <div *ngIf="viewMode === 'cards'">
            <app-job-cards 
              [jobs]="jobs"
              [loading]="loading"
              (jobSelected)="onJobSelected($event)">
            </app-job-cards>
          </div>
        </mat-card-content>
      </mat-card>

    </mat-sidenav-content>

    <!-- Sidebar Sidenav -->
    <mat-sidenav 
      #sidenav 
      mode="side" 
      position="end" 
      [opened]="sidebarOpen"
      class="w-96 border-l border-gray-200">
      
      <app-job-detail-sidebar
        [job]="selectedJob"
        [loading]="loading"
        (close)="onSidebarClose()"
        (statusUpdate)="onStatusUpdate($event)">
      </app-job-detail-sidebar>
      
    </mat-sidenav>

  </mat-sidenav-container>

</div>
