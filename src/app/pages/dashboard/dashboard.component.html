<div class="h-screen bg-background-light">
  
  <!-- Enhanced Header with Gradient + Header-only dark mode toggle -->
  <mat-toolbar [ngClass]="isDarkHeader ? 'bg-gradient-to-r from-secondary-900 to-secondary-800 shadow-medium' : 'bg-gradient-to-r from-primary-600 to-primary-700 shadow-medium'">
    <div class="flex items-center justify-between w-full px-6">
      <div class="flex items-center space-x-4">
        <div class="p-2 rounded-lg" [ngClass]="isDarkHeader ? 'bg-white/10' : 'bg-white/20'">
          <mat-icon class="text-white text-2xl">warehouse</mat-icon>
        </div>
        <h1 class="text-2xl font-bold text-white">Warehouse Dashboard</h1>
      </div>
      <div class="flex items-center space-x-3">
        <button mat-stroked-button (click)="toggleHeaderTheme()" class="!border-white/30 !text-white hover:!bg-white/10">
          <mat-icon class="mr-2">{{ isDarkHeader ? 'light_mode' : 'dark_mode' }}</mat-icon>
          {{ isDarkHeader ? 'Light' : 'Dark' }} header
        </button>
      </div>
    </div>
  </mat-toolbar>

  <!-- Main Content with Sidenav -->
  <mat-sidenav-container class="h-full">
    
    <!-- Main Content Area -->
    <mat-sidenav-content class="p-6">
      
      <!-- Filter Section -->
      <mat-card class="mb-6 fade-in">
        <mat-card-header>
          <mat-card-title class="text-lg font-semibold text-secondary-800 flex items-center">
            <mat-icon class="text-primary-600 mr-2">filter_list</mat-icon>
            Filter Jobs
          </mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <app-job-filter 
            (filterChange)="onFilterChange($event)">
          </app-job-filter>
        </mat-card-content>
      </mat-card>

      <!-- Content Section with Integrated Controls -->
      <mat-card class="fade-in">
        <mat-card-content class="p-0">
          
          <!-- Table Header with Integrated Controls -->
          <div class="px-6 py-4 border-b border-secondary-200 bg-secondary-50/50">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-4">
                <h3 class="text-lg font-semibold text-secondary-800">Warehouse Jobs</h3>
                <span class="text-sm text-secondary-600 bg-white px-3 py-1 rounded-full border border-secondary-200">
                  {{ jobs.length }} jobs found
                </span>
              </div>
              
              <!-- Right side controls -->
              <div class="flex items-center space-x-4">
                <!-- View Toggle -->
                <mat-button-toggle-group 
                  [value]="viewMode" 
                  (change)="viewMode = $event.value"
                  [disabled]="loading"
                  class="bg-white border border-secondary-200">
                  <mat-button-toggle value="table">
                    <mat-icon class="mr-2 text-sm">table_chart</mat-icon>
                    Table
                  </mat-button-toggle>
                  <mat-button-toggle value="cards">
                    <mat-icon class="mr-2 text-sm">grid_view</mat-icon>
                    Cards
                  </mat-button-toggle>
                </mat-button-toggle-group>
                
                <!-- Refresh button -->
                <button 
                  mat-stroked-button 
                  (click)="refreshJobs()"
                  [disabled]="loading"
                  class="hover:bg-primary-50 hover:border-primary-300 hover:text-primary-700 transition-colors duration-200 h-12 px-4 flex items-center rounded-lg">
                  <mat-icon class="mr-2">refresh</mat-icon>
                  Refresh
                </button>
              </div>
            </div>
          </div>

          <!-- Content Views -->
          <div class="p-0">
            <!-- Table View -->
            <div *ngIf="viewMode === 'table'">
              <app-job-table 
                [jobs]="jobs"
                [loading]="loading"
                (jobSelected)="onJobSelected($event)">
              </app-job-table>
            </div>

            <!-- Card View -->
            <div *ngIf="viewMode === 'cards'">
              <app-job-cards 
                [jobs]="jobs"
                [loading]="loading"
                (jobSelected)="onJobSelected($event)">
              </app-job-cards>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

    </mat-sidenav-content>

    <!-- Sidebar Sidenav -->
    <mat-sidenav 
      #sidenav 
      mode="side" 
      position="end" 
      [opened]="sidebarOpen"
      class="w-96 border-l border-secondary-200">
      
      <app-job-detail-sidebar
        [job]="selectedJob"
        [loading]="loading"
        (close)="onSidebarClose()"
        (statusUpdate)="onStatusUpdate($event)">
      </app-job-detail-sidebar>
      
    </mat-sidenav>

  </mat-sidenav-container>

</div>
